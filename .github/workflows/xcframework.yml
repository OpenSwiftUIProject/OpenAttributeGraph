name: XCFramework

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build_xcframework:
    name: Build XCFramework
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        xcode-version: ["26.3"]   # Swift 6.2.4
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Xcode
        uses: OpenSwiftUIProject/setup-xcode@v2
        with:
          xcode-version: ${{ matrix.xcode-version }}
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Set up Tuist cache
        run: |
          mise trust mise.toml
          mise install
          mise exec -- tuist auth login
          mise exec -- tuist setup cache
        shell: bash
      - name: Build XCFramework
        run: ./Scripts/build_xcframework.sh
      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: OpenAttributeGraph.xcframework.zip
          path: .build/Xcode/Frameworks/OpenAttributeGraph.xcframework.zip
